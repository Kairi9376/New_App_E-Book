name: ebook

services:
  # ------------------------------------------------------------------
  # MySQL 8.0 (matches Laragon MySQL 8.0.30 runtime)
  # Host port 3307 -> container 3306 (avoids clash with Laragon MySQL on 3306)
  # Initialized ONCE from Backend/database.sql on empty data volume.
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: ebook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ebook_db
      TZ: Asia/Bangkok
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Ignore whatever charset a client negotiates and use utf8mb4 for every
      # connection. Without this the image's mysql client falls back to latin1
      # (no locale in the container) and the Lao text in database.sql is stored
      # double-encoded during the entrypoint import.
      - --skip-character-set-client-handshake
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Backend/database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    networks:
      - ebook-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ------------------------------------------------------------------
  # Node.js Express Backend (built from ./Backend/Dockerfile)
  # Reaches MySQL via the Docker network as service host "mysql" (not localhost).
  # Persistent uploads stored in the backend-uploads named volume at /app/uploads.
  # Host port 5001 -> container 5000 (macOS AirPlay Receiver holds 5000).
  # The Flutter client's ApiConfig.apiPort must match this host port.
  # ------------------------------------------------------------------
  # # ເຮັດຫຍັງ: ບັນທຶກເຕືອນເລື່ອງ env ຄ້າງຂອງ container
  # # ຍ້ອນຫຍັງ: `docker compose up -d --build backend` rebuild image ໃໝ່ ແຕ່ຖ້າ service
  # #          spec ບໍ່ປ່ຽນ Compose ຈະໃຊ້ container ເກົ່າຕໍ່ ພ້ອມ env ທີ່ resolve ໄວ້ແຕ່ຕອນ
  # #          ສ້າງຄັ້ງທຳອິດ ການແກ້ຄ່າໃນ .env ຈຶ່ງບໍ່ມີຜົນ ແລະ ຫາສາເຫດຍາກຫຼາຍ
  # #          (ອາການທີ່ພົບຈິງ: JWT_SECRET ຄ້າງເປັນຄ່າເກົ່າ ເຮັດໃຫ້ທຸກ API ຄືນ 401
  # #           ທັງທີ່ login ສຳເລັດ)
  # # ແກ້ຈາກສ່ວນໃດ: ບໍ່ເຄີຍມີບັນທຶກເລື່ອງນີ້ໄວ້
  # # ແກ້ເຮັດຫຍັງ: ຫຼັງແກ້ .env ໃຫ້ໃຊ້ `docker compose up -d --force-recreate backend`
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ebook-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ebook_db
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    ports:
      - "5001:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - ebook-network
    # # ເຮັດຫຍັງ: ເພີ່ມ healthcheck ໃຫ້ backend
    # # ຍ້ອນຫຍັງ: ມີໃຫ້ແຕ່ mysql ຖ້າ backend ຄ້າງ (ບໍ່ຕອບ HTTP ແຕ່ process ຍັງຢູ່)
    # #          Docker ຈະຖືວ່າປົກກະຕິ ແລ້ວ restart: unless-stopped ຈະບໍ່ຊ່ວຍຫຍັງເລີຍ
    # # ແກ້ຈາກສ່ວນໃດ: service backend ບໍ່ມີ healthcheck ເລີຍ
    # # ແກ້ເຮັດຫຍັງ: ຍິງ /api/health ດ້ວຍ node (image alpine ບໍ່ມີ curl ຕິດມາ)
    # #             ໃຫ້ docker compose ps ບອກສະຖານະຈິງ ແລະ ຮູ້ຕອນ backend ຕາຍ
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------
  # phpMyAdmin
  # Web UI for managing MySQL database
  # Browser: http://localhost:8090  (host port 8090 -> container 80)
  # 8080 and 8081 are both taken on this machine by unrelated services.
  # Connects to MySQL through Docker network using service name "mysql"
  # ------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ebook-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8090:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ebook-network

volumes:
  mysql-data:
  backend-uploads:

networks:
  ebook-network:
    driver: bridge