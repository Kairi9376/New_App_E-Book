name: ebook

services:
  # ------------------------------------------------------------------
  # MySQL 8.0 (matches Laragon MySQL 8.0.30 runtime)
  # Host port 3307 -> container 3306 (avoids clash with Laragon MySQL on 3306)
  # Initialized ONCE from Backend/database.sql on empty data volume.
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: ebook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ebook_db
      TZ: Asia/Bangkok
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Backend/database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    networks:
      - ebook-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ------------------------------------------------------------------
  # Node.js Express Backend (built from ./Backend/Dockerfile)
  # Reaches MySQL via the Docker network as service host "mysql" (not localhost).
  # Persistent uploads stored in the backend-uploads named volume at /app/uploads.
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ebook-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ebook_db
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - ebook-network

  # ------------------------------------------------------------------
  # phpMyAdmin
  # Web UI for managing MySQL database
  # Browser: http://localhost:8080
  # Connects to MySQL through Docker network using service name "mysql"
  # ------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ebook-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ebook-network

volumes:
  mysql-data:
  backend-uploads:

networks:
  ebook-network:
    driver: bridge