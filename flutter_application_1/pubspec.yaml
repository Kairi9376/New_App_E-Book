  http: ^0.13.6
  url_launcher: ^6.1.6
  flutter_svg: ^2.0.5
  shared_preferences: ^2.2.0
  file_picker: ^5.2.5
  pdfrx: ^1.0.33

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

